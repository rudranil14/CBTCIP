<!-- templates/contacts/base.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ContactMaster AI{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        html,body{
            height:100%;
        }

        body{
            background:linear-gradient(135deg,#d4fc79,#96e6a1);
            font-family:'Segoe UI',sans-serif;

            display:flex;
            flex-direction:column;
        }

        /* NAVBAR */

        .navbar{

            background:#198754 !important ;

            box-shadow:0 3px 15px rgba(0,0,0,.15);
            padding: 0px 0;
            min-height: 50px;
        }

        .navbar-brand{

            font-size: 22px;  /* reduces logo size */
            padding: 0;
            font-weight:bold;

        }

        .nav-link{

            color:white !important;

           font-size: 18px;
           padding: 6px 10px;

            transition:.3s;

            font-weight:600;

        }

        .nav-link:hover{

            color:#FFD700 !important;

            transform:translateY(-2px);

        }

        /* MAIN */

        main{

            flex:1;

        }

        .container{
            background: rgba(255, 248, 235, 0);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    border-radius: 22px;

    padding: 30px;

    margin-top: 30px;

    margin-bottom: 30px;

    border: 1px solid rgba(255, 255, 255, 0);

    box-shadow:
        0 10px 25px rgba(0,0,0,.12),
        0 20px 45px rgba(0,0,0,.10);

    transition: all .35s ease;

    display: flex;
    justify-content: center;


        }
        .container:hover{

    transform: translateY(-5px);

    box-shadow:
        0 18px 35px rgba(0,0,0,.18),
        0 30px 60px rgba(0,0,0,.12);
}

        .card{

            width: 100%;              /* take full container width */

    border-radius: 18px;

    border: none;

    background: #ffffff;

    box-shadow: 0 10px 25px rgba(0,0,0,.12);

    padding: 20px;

    transition: all .3s ease;


        }

        .card:hover{
  transform:translateY(-8px);

    box-shadow:0 20px 45px rgba(25,135,84,.25);


        }

        /* BUTTONS */

        .btn{

            border-radius:12px;

            font-weight:600;

            transition:.3s;

        }

        .btn:hover{

            transform:scale(1.04);

        }

        /* FORM */

        .form-control{

            border-radius:12px;

            height:50px;

        }

        .form-control:focus{

            border-color:#198754;

            box-shadow:0 0 10px rgba(25,135,84,.3);

        }

        /* FOOTER */

        footer{

            background:#212529;

            color:white;

            text-align:center;

            padding:12px;

            margin-top:auto;

            font-size:14px;

        }

        footer strong{

            color:#7CFC00;

        }
        .feature-card{

    border:none;

    border-radius:18px;

    transition:.3s;

    cursor:pointer;

}

.feature-card:hover{

    transform:translateY(-8px);

    box-shadow:0 15px 30px rgba(0,0,0,.18);

}

.feature-card h2{

    font-size:45px;

}

.feature-card p{

    color:#666;

}

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3" href="{% url 'home' %}">
            📒 ContactMaster AI
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link px-4" href="{% url 'home' %}">
                         Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-4" href="{% url 'about' %}">
                        ℹ About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-4" href="{% url 'faq' %}">
                         FAQ
                    </a>
                </li>

            </ul>

            <a href="{% url 'logout' %}" class="btn btn-warning fw-bold">
                🚪 Logout
            </a>

        </div>

    </div>

</nav>

<main class="container my-4">

<div class="card">

<div class="card-body p-4">

{% if messages %}

{% for message in messages %}

<div class="alert alert-success">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% block content %}

{% endblock %}

</div>

</div>

</main>

<footer>

© 2026 <strong>ContactMaster AI</strong> |
Developed by <strong>Rudranil Biswas</strong>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded",function(){

const phone=document.querySelector("#id_phone");

if(phone){

phone.addEventListener("input",function(){

this.value=this.value.replace(/[^0-9]/g,'');

});

}

});

</script>

</body>
</html>
