{% extends 'contacts/base.html' %}

{% block title %}{{ service }}{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-5">

            <h2 class="text-center text-danger mb-4">

                {{ service }}

            </h2>

            <p class="text-center text-muted">

                Enter your location to find nearby emergency contacts.

            </p>

            <form method="GET"
                  action="{% url 'emergency_results' service %}">

                <div class="mb-3">

                    <label class="form-label">

                        State

                    </label>

                    <input
                        type="text"
                        name="state"
                        class="form-control"
                        placeholder="Example: West Bengal"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        City

                    </label>

                    <input
                        type="text"
                        name="city"
                        class="form-control"
                        placeholder="Example: Kolkata"
                        required>

                </div>

                <button class="btn btn-danger w-100 mb-3">

                    🔍 Search

                </button>

            </form>

            <!-- Back Button -->

            <div class="text-center">

                <a href="{% url 'emergency' %}"
                   class="btn btn-outline-secondary">

                    ⬅ Back to Emergency

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
