<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAQ | ContactMaster AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background: linear-gradient(135deg,#d4fc79,#96e6a1);

font-family:'Segoe UI',sans-serif;

}

.card{

border:none;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

</style>

</head>

<body>

<div class="container py-5">

<div class="card p-5">

<h1 class="text-success text-center fw-bold mb-4">

<div class="accordion" id="faqAccordion">

<div class="accordion-item">

<h2 class="accordion-header">

<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#one">

What is ContactMaster AI?

</h2>

<div class="accordion-body">

A smart platform for storing and managing contacts securely.

</div>

</div>

</div>

<div class="accordion-item">

<h2 class="accordion-header">

<button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#two">

Is my data secure?

</button>

</h2>

<div id="two" class="accordion-collapse collapse">

<div class="accordion-body">

Yes. Every user's contacts are private and protected.

</div>

</div>

</div>

<div class="accordion-item">

<h2 class="accordion-header">

<button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#three">

Will AI Assistant be available?

</button>

</h2>

<div id="three" class="accordion-collapse collapse">

<div class="accordion-body">

Yes! AI-powered search and recommendations are coming in future updates.

</div>

</div>

</div>

</div>


<div class="text-center mt-4">

<a href="{% url 'home' %}" class="btn btn-success">

 Back Home

</a>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
