<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login | ContactMaster AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            background: linear-gradient(135deg,#d4fc79,#96e6a1);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:'Segoe UI',sans-serif;

        }

        .login-card{

            width:420px;

            background:white;

            border-radius:20px;

            padding:40px;

            box-shadow:0 20px 40px rgba(0,0,0,.15);

        }

        .logo{

            font-size:55px;

        }

        .form-control{

            border-radius:12px;

            height:48px;

        }

        .btn-success{

            border-radius:12px;

            height:48px;

            font-weight:600;

        }

        a{

            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <div class="logo">📒</div>

        <h2 class="fw-bold">ContactMaster AI</h2>

        <p class="text-muted">

            Login your account

        </p>

    </div>

    <form method="post">

        {% csrf_token %}
        {% if messages %}

    {% for message in messages %}

        <div class="alert alert-danger">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}

        <div class="mb-3">

            <label class="fw-semibold">Username</label>

            <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter Username"
            required>

        </div>

        <div class="mb-3">

            <label class="fw-semibold">Password</label>

            <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter Password"
            required>

        </div>

        <button class="btn btn-success w-100 mt-2">

            Login

        </button>

    </form>

    <div class="text-center mt-4">

        Don't have an account?

        <a href="{% url 'register' %}">

            Register 

        </a>

    </div>

</div>

</body>

</html>
